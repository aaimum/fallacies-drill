<style>
/* Layout: one working column. Start teaches the three kinds of mistake, Learn introduces families in small batches, Play runs the timed games. Clinical "diagnose the case" feel. */

}

  --accent:#7aa8f0; --accent-soft:#1d2c44; --ok:#5fc48a; --ok-soft:#17311f; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e2b25a; --warn-soft:#352914;
  --fal:#7aa8f0; --fal-soft:#1d2c44; --bia:#cf9be6; --bia-soft:#2e1f38;

:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3743;
  --accent:#7aa8f0; --accent-soft:#1d2c44; --ok:#5fc48a; --ok-soft:#17311f; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e2b25a; --warn-soft:#352914;
  --fal:#7aa8f0; --fal-soft:#1d2c44; --bia:#cf9be6; --bia-soft:#2e1f38;

td.name{font-weight:700;min-width:140px}

.flag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
input[type=search]{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:300px}
.clusters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.cl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cl .ask{font-size:.9rem;color:var(--accent);font-weight:700}

.why dt{font-weight:700} .why dd{margin:0}

.gradegrid div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
.gradegrid div.hl{border-color:var(--accent);background:var(--accent-soft)}
kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}

<script>
const ITEMS = [
{n:1,name:"False premises",src:"Cottrell p.82",cue:"The argument rests on an underlying belief that turns out to be untrue.",s:[
"A café owner orders three times the usual milk for Saturday because the city marathon will bring thousands of runners past the door. The route is diverted two streets away and sales are normal.",
"Getting wet in the rain gives you a cold. The squad trained for three hours in a downpour, so expect half of them to be off sick this week."]},
{n:2,name:"Two wrongs don't make a right",src:"Cottrell p.106",cue:"A wrong is excused because someone else did the same, or did wrong first.",s:[
"Yes, I padded my expense claim. But the company cut our bonuses without warning, so it evens out.",
"The opposition can hardly criticise us for appointing party donors to the board. They did exactly the same when they were in power."]},
{n:3,name:"Stereotyping",src:"Cottrell pp.86-88",cue:"A fixed set of traits attached to a whole group and applied to an individual.",s:[
"Give the client email to someone else. Tom is an engineer, so his writing will be hopeless.",
"On the left are the pilots' rest rooms, gentlemen, and the cabin crew rooms are on the right, ladies."]},
{n:4,name:"Lack of consistency in the argument",src:"Cottrell pp.61-64",cue:"Parts contradict each other, or the conclusion does not follow from the author's own reasons.",s:[
"There was a murder near the station last night. There are always young lads hanging around there. One of them probably did it. The local council should ban young people from hanging around the station. (Handbook sample)",
"Remote work destroys productivity and must end. Our best quarter ever was last year, when the whole team was remote.",
"Coffee helps concentration. Caffeine disrupts focus. Coffee is mostly caffeine, so it cannot help you concentrate."]},
{n:5,name:"Unnecessary background information",alt:"proof by verbosity",src:"Cottrell pp.50-54",cue:"Piles of detail that do not support the claim, so the volume itself seems to prove it.",s:[
"Before I explain why we should switch supplier: the firm was founded in Cork in 1987 by two brothers, moved premises twice, redesigned its logo in 2004, and the founders' father was a trawlerman. So clearly they are the right choice.",
"Asked whether the new system will cut costs, the consultant presents a 40-page deck on the history of ERP and a glossary of cloud terms, with no cost figure anywhere. The board approves it because it looks so thorough."]},
{n:6,name:"Assumption not supported by the evidence",alt:"non sequitur",src:"Cottrell pp.78-79",cue:"The conclusion jumps across a hidden assumption the evidence does not support.",s:[
"Our app has a 4.8-star rating in the App Store. Therefore it is GDPR compliant.",
"It rains a lot in Ireland, so Irish people must be strong swimmers."]},
{n:7,name:"False correlation",src:"Cottrell p.93",cue:"Two trends move together but have no real relationship at all; pure coincidence.",s:[
"Phones now come in far more colours than ten years ago, and phone theft has risen too. The wider the colour range, the higher the theft rate.",
"Since the café started playing jazz, more cyclists have been passing on the street outside. More jazz, more cycling."]},
{n:8,name:"Incorrectly assuming a causal link",alt:"post hoc ergo propter hoc",src:"Cottrell p.92",cue:"B came after A, so A must have caused B. The tell is the time order.",s:[
"I wore my new shoes to the interview and got the job. They are my lucky shoes now.",
"We launched the new logo in March and sales rose in April. The rebrand worked.",
"A prisoner who protested on the roof was released. That is the second roof protester released this year. Roof protests must be a good way to get out."]},
{n:9,name:"Confusing correlation and causation",alt:"cum hoc ergo propter hoc",src:"Module sheet",cue:"A and B occur together, so one causes the other. Usually a third factor drives both.",s:[
"Ice cream sales and drownings rise together, so ice cream must make swimmers careless.",
"Students who own more books get better grades. Give every student fifty books and grades will rise."]},
{n:10,name:"Not meeting necessary and sufficient conditions",src:"Cottrell pp.95-97",cue:"One required condition is treated as enough to prove the case, or a non-essential one is treated as required.",s:[
"You need a ticket to win the lottery. Aisling has bought a ticket, so she is going to be rich.",
"Raj doesn't have an MBA, so he can't be a good manager.",
"The report mentions branches, so it must be about trees."]},
{n:11,name:"Over-generalisation",src:"Cottrell p.123",cue:"A general rule drawn from too small a sample.",s:[
"My first child slept through the night and my second didn't. First-born children are better sleepers.",
"I took one online course and it was dull. Online courses don't work."]},
{n:12,name:"False analogy",alt:"false equivalence",src:"Cottrell p.98",cue:"Two things compared as if alike when they are not alike in the way that matters.",s:[
"Running a country is just like running a household: you never spend more than you earn, so the government should never borrow.",
"Human cloning must be banned. It will create another Frankenstein's monster."]},
{n:13,name:"Deflection",src:"Cottrell p.100",cue:"'Obviously', 'clearly', 'it's 2026!' Language that implies no proof is needed.",s:[
"Obviously the four-day week is the future. It's 2026, not 1950.",
"Clearly there's no need to look at the data on this; the answer is self-evident."]},
{n:14,name:"Complicity",src:"Cottrell p.100",cue:"'As we all know', 'surely we all agree'. The reader is drawn in as if already agreeing.",s:[
"As we all know, open-plan offices kill concentration, so the redesign should go ahead.",
"It is well established, and surely we all share the view, that exams are a poor test of ability."]},
{n:15,name:"Exclusion",src:"Cottrell p.100",cue:"Opponents cast as an out-group: 'any decent person', 'people like them'.",s:[
"Any sensible parent would support banning phones in schools. The only people objecting are tech lobbyists.",
"Real Dubliners understand why the congestion charge is needed. It's only blow-ins from the commuter belt who complain."]},
{n:16,name:"Unwarranted leaps",alt:"castle of cards; sleight of hand",src:"Cottrell p.102",cue:"Two plus two makes five: a chain of unproven steps, or a quiet switch in wording at the conclusion.",s:[
"Commuters want less traffic. A toll would reduce traffic. So commuters will support a heavy toll.",
"Speed cameras can't catch every driver, so speeding laws can't be enforced. Laws that can't be enforced shouldn't exist. So speeding isn't really an offence."]},
{n:17,name:"Emotive language",alt:"loaded language",src:"Cottrell p.103",cue:"Charged words and emotive subjects do the persuading in place of reasons.",s:[
"Closing the library will leave our poor little children abandoned on the streets, with nowhere safe to go.",
"This reckless, job-killing tax grab must be stopped."]},
{n:18,name:"Attacking the person",alt:"ad hominem",src:"Cottrell p.103",cue:"Attacks the person's character or life instead of their argument.",s:[
"Ignore the CFO's forecast. He went through a very public divorce last year.",
"The manager says the two new signings will turn the season round. But after that affair splashed across the papers, why believe anything he says?"]},
{n:19,name:"Misrepresentation",alt:"straw man",src:"Cottrell p.105",cue:"The opponent's view is restated in a distorted or exaggerated form, then that version is attacked.",s:[
"'We should give pensioners more help with heating bills.' 'So you want the rest of us to hand over our whole salary in tax?'",
"My colleague says we should pilot the AI tool before rollout. Apparently she thinks we should never adopt any new technology."]},
{n:20,name:"Trivialisation",alt:"reductionism",src:"Cottrell p.105",cue:"A serious or complex matter made to look minor, or reduced to a single simple cause.",s:[
"Burnout is just people who can't manage their diaries.",
"Homelessness exists because some people don't want to work."]},
{n:21,name:"Tautology",src:"Cottrell p.106",cue:"The same point repeated in different words. The argument goes nowhere.",s:[
"We need more money for staff training because staff need more training, which is why investment in training is required.",
"The project failed because it was unsuccessful."]},
{n:22,name:"Poor referencing",src:"Cottrell pp.113-117",cue:"Claims attributed vaguely, wrongly or uncheckably.",s:[
"Studies show that 90% of change programmes fail (Internet, 2024).",
"As experts have long said, remote workers are 40% more productive. (No author, no date, no source given.)"]},
{n:23,name:"Circular argument",alt:"begging the question",src:"Module sheet",cue:"The conclusion is already assumed in a premise.",s:[
"The CEO is trustworthy because he says so, and he wouldn't lie because he is trustworthy.",
"This newspaper is reliable because it says it only prints the truth."]},
{n:24,name:"Pathetic fallacy",src:"Module sheet",cue:"Human feelings or intentions given to nature or objects.",s:[
"The sea was angry that night, punishing the little boat for daring to leave the harbour.",
"The printer hates me. It always jams the night before a deadline."]},
{n:25,name:"Fundamental attribution error",src:"Module sheet",cue:"Someone else's behaviour blamed on their character, ignoring their situation.",s:[
"The new hire missed stand-up twice this week. He's just lazy. (It was the week of the bus strike.)",
"That driver cut across my lane. What a selfish person."]},
{n:26,name:"Affirming the consequent",src:"Module sheet; Lee (2025)",cue:"If A then B. B is true. Therefore A.",s:[
"If it had rained, the street would be wet. The street is wet. So it rained.",
"Well-governed firms pass their audits. Firm X passed its audit, so it must be well governed."]},
{n:27,name:"Conflation",src:"Module sheet",cue:"Two distinct ideas merged as if they were one.",s:[
"She's always busy, so she must be productive.",
"He has 20,000 LinkedIn followers, so he's clearly an expert in his field."]},
{n:28,name:"False dichotomy",src:"Module sheet",cue:"Only two options offered when others exist.",s:[
"Either we put a 10 pm curfew on all teenagers or we accept savage assaults on our streets.",
"You're either behind this restructure or you're against the company."]},
{n:29,name:"Self-serving bias",src:"Module sheet",cue:"My successes come from my ability; my failures come from outside factors.",s:[
"We hit target this quarter because of my strategy. Last quarter we missed because the market turned.",
"I got an A on the essay because I write well. The C in statistics was the lecturer's unfair marking."]},
{n:30,name:"Confirmation bias",alt:"belief bias",src:"Module sheet",cue:"Seeks out or notices only evidence that fits what you already think.",s:[
"Convinced the new analyst is weak, the manager logs every mistake she makes and none of her wins.",
"I searched 'is coffee good for you' and read the first five articles that said yes."]},
{n:31,name:"Hindsight bias",src:"Module sheet",cue:"'I knew it all along', said after the outcome is known.",s:[
"After the start-up collapsed, the investor said the warning signs had been obvious from day one.",
"Once the result was announced, half the office claimed they had always known the merger would fail."]},
{n:32,name:"Availability heuristic",src:"Module sheet",cue:"Likelihood judged by how easily examples spring to mind: recent, vivid, memorable.",s:[
"After watching a documentary on air crashes, Mark drives from Dublin to the south of France instead of flying.",
"Two friends were burgled last month, so Priya reckons one house in three on her street gets burgled each year."]},
{n:33,name:"Representativeness heuristic",src:"Module sheet",cue:"Probability judged by how closely something resembles a typical case.",s:[
"Ciara is quiet, tidy and loves reading, so she is probably a librarian rather than a salesperson.",
"Asked which coin sequence is more likely, HHHHHH or HTTHTH, most people pick the second because it looks more random."]},
{n:34,name:"Anchoring bias",src:"Module sheet",cue:"The first number offered sticks and drags later estimates towards it.",s:[
"The seller opened at €12,000, so €9,500 felt like a bargain, though similar cars sell for €7,000.",
"People first asked whether the Shannon is longer or shorter than 1,000 km then guess its length far higher than people first asked about 100 km."]},
{n:35,name:"Conjunction fallacy",src:"Module sheet",cue:"'A and B' judged more likely than 'A' on its own.",s:[
"Aoife studied philosophy and campaigned on social justice. People rate 'Aoife is a bank teller and active in the feminist movement' as more likely than 'Aoife is a bank teller'.",
"Analysts rate 'a strike that shuts Dublin Airport for a week' as more likely than 'a strike at Dublin Airport'."]},
{n:36,name:"Groupthink",src:"Module sheet",cue:"A close-knit group suppresses doubts to keep harmony; unanimity is an illusion.",s:[
"No one on the close-knit board raised concerns about the acquisition. The one director with doubts kept quiet so as not to spoil the mood.",
"Team members privately thought the launch date was impossible, but everyone nodded it through because the lead was so enthusiastic."]},
{n:37,name:"Risky shift",src:"Module sheet",cue:"After discussion, a group chooses something riskier than its members would alone.",s:[
"Asked separately, each trustee would put 10% of the fund into crypto. After discussing it together they vote for 40%.",
"None of the friends would jump off the pier on their own, but after egging each other on the whole group jumps."]},
{n:38,name:"Misplaced concreteness",alt:"reification",src:"Module sheet",cue:"An abstraction treated as a concrete thing or as an agent with wants.",s:[
"The market wants lower interest rates, and it will punish any government that ignores it.",
"IQ is a fixed object inside your head, and the test simply weighs it, like a scale weighs flour."]},
{n:39,name:"Framing effects",alt:"equivalency frames",src:"Module sheet",cue:"Identical facts, different choice, depending on positive or negative wording.",s:[
"Patients accept an operation described as having a 90% survival rate but refuse the same operation described as having a 10% mortality rate.",
"Shoppers prefer mince labelled '95% fat-free' to the same mince labelled '5% fat'."]},
{n:40,name:"Sunk cost fallacy",src:"Module sheet",cue:"Carrying on because of what has already been spent, not because of future value.",s:[
"We've spent €2 million on this system, so we can't stop now, even though switching would cost less from here.",
"I paid for the concert ticket, so I'll go, even though I'm ill and won't enjoy it."]},
{n:41,name:"Dunning-Kruger effect",src:"Module sheet",cue:"Low skill in a domain leads to overestimating one's own ability in it.",s:[
"After one weekend of YouTube tutorials, Dan tells the board he can build the data platform himself in a fortnight.",
"Students with the lowest scores on a logic test rated their performance as above average."]},
{n:42,name:"Belief perseverance",src:"Module sheet",cue:"A belief survives even after the evidence it rested on is discredited.",s:[
"The manager learns the report rating the supplier as unreliable used another firm's data. She still refuses to use them.",
"Participants were told afterwards that their 'excellent' feedback scores were random. They still believed they were good at spotting fake reviews."]},
{n:43,name:"Barnum effect",alt:"Forer effect",src:"Module sheet",cue:"A vague description that fits almost anyone is felt to be personally accurate.",s:[
"'You have a lot of untapped potential and sometimes doubt whether you made the right decision.' Mia says the horoscope describes her exactly.",
"A personality quiz tells every user they are 'independent, but value close relationships'. Nine in ten rate it highly accurate."]},
{n:44,name:"Declinism",src:"Module sheet",cue:"The past was better; things are steadily getting worse.",s:[
"Students today can't concentrate like we could. Universities have been going downhill for decades.",
"Nothing good has been made in music since the nineties."]},
{n:45,name:"Just-world hypothesis",src:"Module sheet",cue:"People get what they deserve, so victims must have earned it.",s:[
"If he lost his job, he must have done something to deserve it.",
"Anyone who gets scammed online was asking for it."]},
{n:46,name:"In-group bias",src:"Module sheet",cue:"Favouring members of your own group in judgements or rewards.",s:[
"The hiring panel, all Smurfit alumni, rated the Smurfit candidate higher on 'fit' despite identical scores.",
"Asked to split a bonus pool, staff give more to colleagues from their own department."]},
{n:47,name:"Halo effect",src:"Module sheet",cue:"One good trait spills over into judgements of unrelated traits.",s:[
"He's so articulate and well dressed; he must be honest and good with budgets.",
"The company makes beautiful phones, so its banking app must be secure."]},
{n:48,name:"Curse of knowledge",alt:"curse of expertise",src:"Module sheet",cue:"An expert cannot imagine not knowing, so assumes others share the knowledge.",s:[
"The data architect tells new joiners to 'just join the fact table on the surrogate key' and can't see why they look lost.",
"The professor sets what she calls a simple warm-up question. Nobody in the class understands it."]},
{n:49,name:"Appeal to consequences",src:"Module sheet",cue:"A claim judged true or false by whether its consequences would be welcome.",s:[
"AI can't be about to replace junior analysts, because that would be terrible for graduates.",
"There can't be a recession next year. It would ruin my investment plans."]},
{n:50,name:"Appeal to ignorance",src:"Module sheet",cue:"Not proven false, so it's true (or not proven true, so it's false).",s:[
"No one has shown the new supplement is harmful, so it must be safe.",
"Nobody has proved ghosts don't exist, so they probably do."]},
{n:51,name:"Slippery slope",src:"Module sheet",cue:"One small step will inevitably slide to an extreme outcome.",s:[
"If we let staff work from home on Fridays, soon nobody will come in at all, the office will close and the company will collapse.",
"Accept one late assignment and before long no one will meet any deadline."]},
{n:52,name:"Negativity bias",src:"Module sheet",cue:"One negative outweighs many positives.",s:[
"After nineteen glowing reviews and one complaint, the manager can think only about the complaint.",
"Lena remembers the one presentation that went badly, not the ten that went well."]},
{n:53,name:"Optimism bias",src:"Module sheet",cue:"'It won't happen to me.' Underrating one's own risk.",s:[
"Most new restaurants close within three years, but Tom is sure his won't.",
"Drivers rate their own chance of a crash as far below the average driver's."]},
{n:54,name:"Gambler's fallacy",src:"Module sheet",cue:"Past independent outcomes are thought to change the next one: something is 'due'.",s:[
"Red has come up six times in a row, so black is due.",
"We've had three boys, so the next baby is bound to be a girl."]},
{n:55,name:"Reactance bias",src:"Module sheet",cue:"Doing the opposite of what you're told because your freedom of choice feels threatened.",s:[
"When the council banned parking in the lane, residents who had never parked there started doing it.",
"Told the book is banned from the school library, the students all buy a copy."]},
{n:56,name:"Spotlight effect",src:"Module sheet",flag:"Two senses",cue:"Overestimating how much others notice you. The module sheet also uses it for heavily publicised cases taken to represent a whole group.",s:[
"Kev arrives at the lecture with a coffee stain on his shirt and is sure everyone is staring. Afterwards, nobody had noticed.",
"After weeks of headlines about three e-scooter riders injuring pedestrians, a councillor declares that e-scooter users in general are a danger."]},
{n:57,name:"Bandwagon effect",alt:"ad populum",src:"Module sheet",cue:"Believing or doing something because many others do.",s:[
"Everyone in our cohort is buying the new laptop, so it must be the best one.",
"Ten million people take this supplement. It must work."]},
{n:58,name:"Presentism",src:"Module sheet",flag:"Sheet note unclear",cue:"Judging past people or events by today's values or knowledge.",s:[
"Managers in the 1960s were fools for not using email.",
"Medieval doctors were stupid for bleeding their patients."]},
{n:59,name:"Base rate fallacy",src:"Module sheet",cue:"The general prevalence figure is given and then ignored for the specific case.",s:[
"A disease affects 1 in 1,000 people. A test for it is 99% accurate. Sam tests positive and concludes he is 99% likely to have it.",
"85% of a city's taxis are green and 15% blue. A witness, right 80% of the time, says the cab was blue, so the jury is 80% sure it was blue."]},
{n:60,name:"Fallacy of composition",src:"Module sheet",cue:"What is true of the parts must be true of the whole.",s:[
"Every player on the team is a star, so the team will win the league.",
"Each brick is light, so the wall is light too."]}
];

// ---------- per-viewer progress (browser only) ----------
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const stars = n => STARS[n]||0;
function mark(n, ok){ SEEN[n]=true; STARS[n] = ok ? Math.min(3, stars(n)+1) : 0; LS.set("fdd-stars",STARS); LS.set("fdd-seen",SEEN); }

const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = t => t.replace(" (Handbook sample)","");

// distractors: look-alikes first, then same family, then anything
function itemOptions(n, pool){
  if(pool){ return shuffle([n, ...shuffle(pool.filter(x=>x!==n)).slice(0,4)]); }
  const sib = new Set(); (ITEM_CL[n]||[]).forEach(id=>CLUSTERS.find(c=>c.id===id).m.forEach(([x])=>{if(x!==n)sib.add(x)}));
  let picks = shuffle([...sib]).slice(0,2);
  shuffle(FAM_OF[n].m.filter(x=>x!==n && !picks.includes(x))).slice(0,1).forEach(x=>picks.push(x));
  const rest = shuffle(ITEMS.map(i=>i.n).filter(x=>x!==n && !picks.includes(x)));
  while(picks.length<4) picks.push(rest.pop());
  return shuffle([n,...picks]);
}
function itemQ(n, text, pool){
  return {kind:"item", n, ans:n, text: text ?? clean(pick(BY[n].s)), opts:itemOptions(n,pool).map(k=>({k,label:BY[k].name}))};
}
function snapQ(n, pool){ const q=itemQ(n, pick(BY[n].t), pool); q.snap=true; return q; }
function triageQ(n){ return {kind:"fam", n, ans:FAM_OF[n].id, text:clean(pick(BY[n].s)), opts:FAM.map(f=>({k:f.id,label:f.name}))}; }

// ---------- generic game engine ----------
let G=null, tick=null, HOST=null;
function stopGame(){ clearInterval(tick); if(G){ clearTimeout(G.autoT); G.done=true; } }
function play(cfg, host){
  clearInterval(tick); HOST=host;
  G = Object.assign({i:0, score:0, pts:0, streak:0, bestStreak:0, answers:[], t0:Date.now(), locked:false}, cfg);
  showQ(); tick=setInterval(onTick,200);
}
function remaining(){ return G.total ? Math.max(0,G.total-(Date.now()-G.t0)/1000) : Math.max(0,G.perQ-(Date.now()-G.qStart)/1000); }
function onTick(){
  if(!G || G.locked || G.done) return;
  const r=remaining(), el=HOST.querySelector(".clock"), bar=HOST.querySelector(".bar i");
  if(el){ const m=Math.floor(r/60), s=Math.floor(r%60); el.textContent = G.total? `${m}:${String(s).padStart(2,"0")}` : `${Math.ceil(r)} s`; el.classList.toggle("low", G.total? r<120 : r<=3); }
  if(bar) bar.style.width = (100*r/(G.total||G.perQ))+"%";
  if(r<=0){ if(G.total){ while(G.answers.length<G.qs.length) G.answers.push({q:G.qs[G.answers.length],pick:null,secs:0}); finish(); } else answer(null); }
}
function showQ(){
  const q=G.qs[G.i];
  const mult = 1+Math.min(3,Math.floor(G.streak/3));
  HOST.innerHTML = `
  <div class="case">
    <div class="casehead"><span>${esc(G.title)} · ${G.i+1}/${G.qs.length}${G.feedback?` · ${G.score} right`:""}${G.points&&G.streak>=3?` · <span class="streak">streak ${G.streak} · x${mult}</span>`:""}</span><span class="clock">--</span></div>
    <div class="bar"><i style="width:100%"></i></div>
    ${q.snap?`<p class="q" style="padding-top:16px;margin-bottom:-14px">Which one gives itself away like this?</p>`:""}
    <p class="scen${q.snap?" snap":""}">${esc(q.text)}</p>
    <p class="q">${q.kind==="fam"?"Which family? (sort first, name second)":q.snap?"":"This is an example of:"}</p>
    <div class="opts${q.opts.length>5?" two":""}">${q.opts.map((o,k)=>`<button class="opt" data-k="${o.k}"><span class="k">${k+1}</span><span>${esc(o.label)}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="quit">${G.total?"Submit now":"End round"}</button><span class="muted small">Keys <kbd>1</kbd> to <kbd>${q.opts.length}</kbd> answer, <kbd>Enter</kbd> next</span></div>`;
  HOST.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.k));
  HOST.querySelector("#quit").onclick=()=>{ if(G.total){ while(G.answers.length<G.qs.length) G.answers.push({q:G.qs[G.answers.length],pick:null,secs:0}); finish(); } else if(G.answers.length) finish(); else G.onExit(); };
  G.locked=false; G.qStart=Date.now(); onTick();
}
function answer(k){
  if(!G || G.locked || G.done) return;
  const q=G.qs[G.i]; const key = k==null? null : (q.kind==="item"? +k : k);
  const ok = key===q.ans, secs=(Date.now()-G.qStart)/1000;
  G.answers.push({q,pick:key,secs});
  let gained=0;
  if(ok){ G.score++; G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak);
    if(G.points){ const mult=1+Math.min(3,Math.floor((G.streak-1)/3)); gained=(100+Math.round(remaining()*10))*mult; G.pts+=gained; } }
  else G.streak=0;
  if(q.kind==="item") mark(q.n, ok);
  if(!G.feedback){ G.i++; if(G.i>=G.qs.length) finish(); else showQ(); return; }
  G.locked=true;
  HOST.querySelectorAll(".opt").forEach(b=>{b.disabled=true; const kk = q.kind==="item"? +b.dataset.k : b.dataset.k; if(kk===q.ans)b.classList.add("right"); else if(kk===key)b.classList.add("wrong")});
  const it=BY[q.n];
  let body;
  if(q.kind==="fam"){
    const f=FAM_OF[q.n], chosen = key? FAM.find(x=>x.id===key):null;
    body = `<p class="cue"><b>${esc(f.name)}</b>: ${esc(f.gist)} This one is <b>${esc(it.name)}</b>: ${esc(it.d)}</p>${chosen&&!ok?`<p class="cue muted"><b>${esc(chosen.name)}</b> would be: ${esc(chosen.gist)}</p>`:""}`;
  } else {
    const ch = key? BY[key]:null;
    body = `<p class="cue"><b>${esc(it.name)}</b>: ${esc(it.d)}</p><p class="cue muted">Hook: ${esc(it.h)}</p>${ch&&!ok?`<p class="cue muted"><b>${esc(ch.name)}</b> would need: ${esc(ch.d)}</p>`:""}`;
  }
  const auto = G.points && ok;
  HOST.querySelector("#fb").innerHTML = `<div class="fb">
    <span class="verdict ${ok?"ok":"bad"}">${ok?"Correct":key===null?"Time's up":"Not this one"} · ${secs.toFixed(1)} s ${gained?`<span class="pop">+${gained}</span>`:""}</span>
    ${body}
    <div><button class="btn" id="next">${G.i+1<G.qs.length?"Next":"See result"}</button></div></div>`;
  HOST.querySelector("#next").onclick=next; HOST.querySelector("#next").focus();
  if(auto){ G.autoT=setTimeout(()=>{ if(G && G.locked && !G.done) next(); }, 900); }
}
function next(){ clearTimeout(G.autoT); G.i++; if(G.i>=G.qs.length) finish(); else showQ(); }
function finish(){
  clearInterval(tick); clearTimeout(G.autoT);
  const n=G.qs.length, score=G.answers.filter(a=>a.pick===a.q.ans).length;
  const answered=G.answers.filter(a=>a.pick!==null), avg = answered.length? answered.reduce((t,a)=>t+a.secs,0)/answered.length : 0;
  const misses=G.answers.filter(a=>a.pick!==a.q.ans);
  let best=null, newBest=false;
  if(G.points){ best=BEST[G.id]||0; if(G.pts>best){ BEST[G.id]=G.pts; LS.set("fdd-best",BEST); newBest=true; } }
  const g = G.mock? grade(score) : null;
  HOST.innerHTML = `
  <div class="panel stack">
    <div class="result">
      <div><div class="big">${score}<span class="muted" style="font-size:1.4rem">/${n}</span></div><span class="muted small">${esc(G.title)}</span></div>
      ${g?`<div><div class="grade">${g}</div><span class="muted small">handbook band</span></div>`:""}
      ${G.points?`<div><div class="grade">${G.pts.toLocaleString()}</div><span class="muted small">${newBest?"new best":"best "+best.toLocaleString()}</span></div><div><div class="grade" style="color:var(--bia)">${G.bestStreak}</div><span class="muted small">longest streak</span></div>`:""}
      <div><div class="grade" style="color:var(--ink)">${avg.toFixed(1)} s</div><span class="muted small">avg per answer</span></div>
    </div>
    ${G.mock?`<div class="gradegrid">${[26,25,24,23,22,21,20,19,18].map(p=>`<div class="${p===score?"hl":""}">${p} · ${GRADES[p]}</div>`).join("")}</div>`:""}
    <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Back</button></div>
  </div>
  ${misses.length?`<h2>Review: ${misses.length} missed</h2><div class="misslist">${misses.map(a=>{const it=BY[a.q.n];
    const yours = a.pick==null? "No answer. On the day, always pick something: there is no negative marking."
      : a.q.kind==="fam"? `You chose <b>${esc(FAM.find(f=>f.id===a.pick).name)}</b>.` : `You chose <b>${esc(BY[a.pick].name)}</b>: ${esc(BY[a.pick].d)}`;
    return `<div class="miss"><p>${esc(a.q.text)}</p><p class="cue"><b>${esc(it.name)}</b> (${esc(FAM_OF[a.q.n].name)}): ${esc(it.d)}</p><p class="cue muted">${yours}</p></div>`}).join("")}</div>`:`<p class="muted">Clean round.</p>`}`;
  const again=G.again, exit=G.onExit; G.done=true;
  HOST.querySelector("#again").onclick=again; HOST.querySelector("#home").onclick=exit;
  refreshBoards();
}
document.addEventListener("keydown",e=>{
  if(!G || G.done || !HOST || HOST.closest("section").hidden) return;
  if(["INPUT","SELECT"].includes(e.target.tagName)) return;
  const k=parseInt(e.key,10);
  if(!G.locked && k>=1){ const b=HOST.querySelectorAll(".opt")[k-1]; if(b){b.click(); e.preventDefault();} }

    <p class="def">${esc(it.d)}</p>
    <div><div class="lbl">Giveaway words</div><div class="row" style="gap:6px">${it.t.map(t=>`<span class="chip tell">${esc(t)}</span>`).join("")}</div></div>
    <p class="hook">${esc(it.h)}</p>
    <div><div class="lbl">Example</div><p>${esc(clean(it.s[0]))}</p></div>
    <div><div class="lbl">You'll meet it in</div><p>${esc(it.w)}</p></div>
    ${it.flag?`<p class="small muted">Note: ${esc(it.flag)}. See Source notes.</p>`:""}
  </div>
  <div class="row">
    <button class="btn ghost" id="prev" ${idx===0?"disabled":""}>Previous</button>
    ${idx+1<f.m.length?`<button class="btn" id="nxt">Next card</button>`:`<button class="btn" id="check">Take the check (${f.m.length} Q)</button>`}
    ${single?"":`<button class="btn ghost" id="skip">Skip to the check</button>`}
  </div>`;
  LH.querySelector("#lback").onclick=drawLearnHome;
  const pv=LH.querySelector("#prev"); if(pv) pv.onclick=()=>learnCard(fid,idx-1);
  const nx=LH.querySelector("#nxt"); if(nx) nx.onclick=()=>learnCard(fid,idx+1);
  const ck=LH.querySelector("#check"); if(ck) ck.onclick=()=>familyCheck(fid);
  const sk=LH.querySelector("#skip"); if(sk) sk.onclick=()=>familyCheck(fid);
}
function familyCheck(fid){
  const f=FAM.find(x=>x.id===fid); LEARN=null;
  const qs = shuffle(f.m).map(n=>itemQ(n, null, f.m));
  play({id:"check-"+fid, title:f.name+" check", qs, perQ:40, feedback:true, again:()=>familyCheck(fid), onExit:drawLearnHome}, LH);
}

// ---------- PLAY ----------
const PH=document.getElementById("tab-play");
const SAMPLE_OPTS=[4,21,31,35,37];
function drawPlay(){
  if(G && !G.done && HOST===PH) stopGame();
  const weak = ITEMS.filter(i=>SEEN[i.n] && stars(i.n)<2).length;
  const famSel = `<option value="all">All 60</option><option value="f">Fallacies only</option><option value="b">Biases only</option>${FAM.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("")}`;
  PH.innerHTML = `
  <div class="grid">
    <div class="panel stack"><span class="meta" style="color:var(--bia)">20 rounds · 10 s each · streak multiplier</span><h3>Signal Snap</h3>
      <p class="muted small">Just the giveaway words, no full scenario. Name it fast. Every three in a row raises your multiplier; speed earns bonus points.</p>
      <select id="snapset" aria-label="Snap set">${famSel}</select>
      <div class="row"><button class="btn" id="snap">Play</button><span class="meta">best ${(BEST.snap||0).toLocaleString()}</span></div></div>
    <div class="panel stack"><span class="meta" style="color:var(--bia)">15 rounds · 8 s each</span><h3>Family Triage</h3>
      <p class="muted small">Read a scenario and only sort it into one of the eight families. Trains the first move that halves every question.</p>
      <div class="row"><button class="btn" id="tri">Play</button><span class="meta">best ${(BEST.tri||0).toLocaleString()}</span></div></div>
    <div class="panel stack"><span class="meta">10 Q · 40 s each</span><h3>Sprint</h3>
      <p class="muted small">Full scenarios, test format, five options with look-alikes mixed in. Feedback after each.</p>
      <div class="row"><button class="btn" id="sprint">Play</button></div></div>
    <div class="panel stack"><span class="meta">${weak} item${weak===1?"":"s"} below level 2</span><h3>Weak spots</h3>
      <p class="muted small">Only items you've missed or not yet nailed.</p>
      <div class="row"><button class="btn" id="weak" ${weak?"":"disabled"}>Play</button></div></div>
    <div class="panel stack"><span class="meta">pick a group</span><h3>Look-alike drill</h3>
      <p class="muted small">All five options come from one confusable group.</p>
      <select id="clsel" aria-label="Group">${CLUSTERS.filter(c=>c.m.length>=3).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select>
      <div class="row"><button class="btn" id="clgo">Play</button></div></div>
    <div class="panel stack"><span class="meta">26 Q · 20:00 · no feedback</span><h3>Full mock</h3>
      <p class="muted small">Test conditions: no going back, auto-submits at 20:00, graded on the handbook bands.</p>
      <div class="row"><button class="btn" id="mock">Start mock</button></div></div>
  </div>
  <div class="case">
    <div class="casehead"><span>Handbook sample question</span><span>Cottrell p.63</span></div>
    <p class="scen">${esc(clean(BY[4].s[0]))}</p><p class="q">This is an example of:</p>
    <div class="opts" id="sampleopts">${SAMPLE_OPTS.map((o,i)=>`<button class="opt" data-o="${o}"><span class="k">${"abcde"[i]}</span><span>${esc(BY[o].name)}</span></button>`).join("")}</div>
    <div id="samplefb"></div>
  </div>`;
  const back=()=>drawPlay();
  PH.querySelector("#snap").onclick=()=>{const set=PH.querySelector("#snapset").value; startSnap(set)};
  PH.querySelector("#tri").onclick=startTriage;
  PH.querySelector("#sprint").onclick=startSprint;
  PH.querySelector("#weak").onclick=startWeak;
  PH.querySelector("#clgo").onclick=()=>startCluster(PH.querySelector("#clsel").value);
  PH.querySelector("#mock").onclick=startMock;
  PH.querySelectorAll("#sampleopts .opt").forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.o===4;
    PH.querySelectorAll("#sampleopts .opt").forEach(x=>{x.disabled=true; if(+x.dataset.o===4)x.classList.add("right"); else if(x===b)x.classList.add("wrong")});
    PH.querySelector("#samplefb").innerHTML=`<div class="fb"><span class="verdict ${ok?"ok":"bad"}">${ok?"Correct: (a)":"The answer is (a)"}</span><p class="cue">Cottrell uses this exact passage for logical consistency: the reason (young people hang around the station) doesn't support the conclusion (ban all young people). Stereotyping isn't offered, so you win by triage: it's an argument with a 'should', so it's a fallacy, and the other four are a repetition fallacy and three biases.</p></div>`;
  });
}
function pool(set){
  if(set==="all") return ITEMS.map(i=>i.n);
  if(set==="f"||set==="b") return FAM.filter(f=>f.k===set).flatMap(f=>f.m);
  return FAM.find(f=>f.id===set).m;
}
function startSnap(set){
  const p=pool(set); const restrict = (set!=="all" && set!=="f" && set!=="b")? p : null;
  const order=[]; while(order.length<20) order.push(...shuffle(p));
  play({id:"snap", title:"Signal Snap", qs:order.slice(0,20).map(n=>snapQ(n,restrict)), perQ:10, feedback:true, points:true, again:()=>startSnap(set), onExit:drawPlay}, PH);
}
function startTriage(){ play({id:"tri", title:"Family Triage", qs:shuffle(ITEMS.map(i=>i.n)).slice(0,15).map(triageQ), perQ:8, feedback:true, points:true, again:startTriage, onExit:drawPlay}, PH); }
function startSprint(){ play({id:"sprint", title:"Sprint", qs:shuffle(ITEMS.map(i=>i.n)).slice(0,10).map(n=>itemQ(n)), perQ:40, feedback:true, again:startSprint, onExit:drawPlay}, PH); }
function startWeak(){
  const w=ITEMS.filter(i=>SEEN[i.n] && stars(i.n)<2).map(i=>i.n); if(!w.length){drawPlay();return}
  const order=[]; while(order.length<Math.min(15,w.length*2)) order.push(...shuffle(w));
  play({id:"weak", title:"Weak spots", qs:order.slice(0,Math.min(15,w.length*2)).map(n=>itemQ(n)), perQ:40, feedback:true, again:startWeak, onExit:drawPlay}, PH);
}
function startCluster(cid){
  const c=CLUSTERS.find(x=>x.id===cid), p=c.m.map(x=>x[0]); const list=[]; p.forEach(n=>BY[n].s.forEach(t=>list.push([n,t])));
  play({id:"cl", title:c.title, qs:shuffle(list).slice(0,12).map(([n,t])=>itemQ(n,clean(t),p)), perQ:40, feedback:true, again:()=>startCluster(cid), onExit:drawPlay}, PH);
}
function startMock(){ play({id:"mock", title:"Full mock", mock:true, qs:shuffle(ITEMS.map(i=>i.n)).slice(0,26).map(n=>itemQ(n)), total:1200, feedback:false, again:startMock, onExit:drawPlay}, PH); }

// ---------- CHEAT SHEET ----------

  const el=document.getElementById("tab-sheet");
  el.innerHTML = `<div class="row" style="justify-content:space-between">
    <select id="sf" aria-label="Family"><option value="">All families</option>${FAM.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select>
    <input type="search" id="q" placeholder="Search a word or phrase" aria-label="Search"></div>
    <div class="tblwrap"><table><thead><tr><th>#</th><th>Name</th><th>Plain meaning and giveaway words</th><th>Hook</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <p class="muted small">Numbers follow the module list. Items 1 to 22: Cottrell (2023). Items 23 to 60: module spreadsheet.</p>`;
  const draw=()=>{ const f=el.querySelector("#q").value.toLowerCase(), fam=el.querySelector("#sf").value;
    el.querySelector("#tbody").innerHTML = FAM.filter(x=>!fam||x.id===fam).flatMap(x=>x.m).map(n=>BY[n]).filter(i=>!f||(i.name+" "+(i.alt||"")+" "+i.d+" "+i.t.join(" ")+" "+i.h).toLowerCase().includes(f)).map(i=>`<tr>
      <td class="n">${i.n}</td>
      <td class="name">${esc(i.name)}${i.alt?`<div class="muted small" style="font-weight:400">${esc(i.alt)}</div>`:""}<div style="margin-top:6px"><span class="chip ${FAM_OF[i.n].k}" style="font-weight:400;font-size:.75rem">${esc(FAM_OF[i.n].name)}</span></div>${i.flag?`<span class="flag">${esc(i.flag)}</span>`:""}</td>
      <td>${esc(i.d)}<div class="tells">${i.t.map(t=>`<span class="chip tell">${esc(t)}</span>`).join("")}</div></td>
      <td class="muted">${esc(i.h)}</td></tr>`).join(""); };
  el.querySelector("#q").addEventListener("input",draw); el.querySelector("#sf").addEventListener("change",draw); draw();
}

// ---------- LOOK-ALIKES ----------
function drawPairs(){
  const el=document.getElementById("tab-pairs");
  el.innerHTML = `<p class="muted small">Each group is a set the test can put side by side as options. Learn the one question that splits them, then drill the group.</p>
  <div class="clusters">${CLUSTERS.map(c=>`<div class="cl"><h3>${esc(c.title)}</h3><p class="ask">Ask: ${esc(c.ask)}</p>
    <dl>${c.m.map(([n,t])=>`<dt>${esc(BY[n].name)}</dt><dd>${esc(t)}</dd>`).join("")}</dl>
    ${c.m.length>=3?`<button class="btn ghost go" data-c="${c.id}" style="align-self:flex-start">Drill this group</button>`:""}</div>`).join("")}</div>`;
  el.querySelectorAll(".go").forEach(b=>b.onclick=()=>{showTab("play"); startCluster(b.dataset.c)});
}

// ---------- NOTES ----------
function drawNotes(){
  document.getElementById("tab-notes").innerHTML = `
  <div class="panel stack"><h2>What the test draws on</h2>
    <p>Items 1 to 22 are defined in Cottrell (2023), chapters 5 to 8. Items 23 to 60 are defined only in the module spreadsheet, which links to Wikipedia and changingminds.org. The handbook sample question is Cottrell's own passage from p.63, so expect other questions to reuse Cottrell's examples. Every scenario, hook and giveaway phrase here was written for practice; none are past test questions.</p></div>
  <h2>Where the sources disagree</h2>
  <div class="note"><b>Spotlight effect (56).</b> The spreadsheet note describes the spotlight fallacy: well-publicised cases assumed to represent a whole group. The usual psychology meaning is overestimating how much others notice you. Both are drilled. For a 'headline cases' scenario with both Spotlight effect and Availability heuristic offered, the spreadsheet points to Spotlight effect.</div>
  <div class="note"><b>Presentism (58).</b> The spreadsheet note is garbled. Use the standard meaning: judging the past by present-day values or knowledge.</div>
  <div class="note"><b>Lack of consistency (4) vs non sequitur (6).</b> Cottrell's 'logical consistency' covers conclusions that don't follow from their reasons, which overlaps with non sequitur. The handbook sample keys the station murder passage to Lack of consistency. If both are offered: a contradiction, or a Cottrell passage, points to 4; one specific hidden assumption points to 6.</div>
  <div class="note"><b>Exclusion (15) vs in-group bias (46).</b> Exclusion is a move inside an argument (casting opponents as outsiders). In-group bias is a judgement or reward that favours your own group.</div>
  <div class="note"><b>Trivialisation (20).</b> Cottrell means making a serious matter look minor; the spreadsheet links it to the single-cause fallacy. Both senses map to 20.</div>
  <div class="note"><b>Restricted options.</b> Cottrell files 'only two options' under misrepresentation (p.105). The list has False dichotomy (28) as its own item, so pick that if offered.</div>
  <div class="panel stack"><h2>On the day</h2><ul class="tight">
    <li>No negative marking, no going back. Never leave a blank: triage, eliminate, commit at about 40 s.</li></ul></div>`;
}

// ---------- tabs ----------
function showTab(t){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  ["start","learn","play","sheet","pairs","notes"].forEach(x=>document.getElementById("tab-"+x).hidden = x!==t);
  if(t==="start") refreshBoards();
  if(t==="learn" && !LEARN && (!G || G.done || HOST!==LH)) drawLearnHome();
  if(t==="play" && (!G || G.done || HOST!==PH)) drawPlay();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
drawStart(); drawLearnHome(); drawPlay(); drawSheet(); drawPairs(); drawNotes();
</script>
